# Continuous integration: the whole-repo checks and every TypeScript test on each push and pull request.
# The Python oracle's heavy groups (torch, numpyro, ...) are not installed: tests never run Python, and the
# fixtures are checked locally with `make fixtures-check`.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --group dev
      - name: Barrels, layers and lint
        run: make barrels-check layers lint
      - name: Type-check (TypeScript)
        run: |
          for p in engine render meta hub; do pnpm --dir packages/$p exec tsc -p tsconfig.json --noEmit; done
          pnpm --dir apps/site exec tsc -p tsconfig.json --noEmit
          pnpm exec tsc -p tsconfig.json
      - name: Tests
        run: make test
      - name: Examples
        run: make examples
