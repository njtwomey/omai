# Tarballs: builds omai-engine, omai-render and omai-meta and packs each as the npm tarball a release would publish.
# A separate build from ci.yml, run after ci succeeds on main (and on demand, and for release tags), so a red ci never
# yields tarballs. The tarballs are uploaded as a workflow artifact and their sizes are written to the job summary.
# A `v<version>` tag (made by `make release`) also publishes one GitHub release for the version, with the changelog entry
# as its notes and the three tarballs attached.
name: pack

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  pack:
    # Only after a green ci (a manual run or a tag has no ci run to wait for).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: jdx/mise-action@v5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and pack
        run: make pack
      - name: Sizes
        run: |
          {
            echo "### Tarballs"
            echo
            echo '| package | compressed | files |'
            echo '| --- | ---: | ---: |'
            for f in tarballs/*.tgz; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) | $(tar tzf "$f" | wc -l) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: tarballs-${{ github.event.workflow_run.head_sha || github.sha }}
          path: tarballs/*.tgz
          if-no-files-found: error
          retention-days: 30
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # the notes: the changelog entry of this version, up to the next entry
          awk -v v="$version" '$0 == "## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$TAG" tarballs/*.tgz --title "$version" --notes-file notes.md
