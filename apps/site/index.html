<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>omai</title>
    <meta name="description" content="omai: the render gallery, the hub of worked methods and the engine documentation." />
    <script>
      // Dark by default; a stored choice from the toggle wins. Set before first paint, so there is no flash.
      try {
        if (localStorage.getItem('omai-colour-mode') !== 'light') document.documentElement.classList.add('dark')
      } catch {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
