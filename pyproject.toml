[project]
name = "whitebox-oracle"
version = "0.1.0"
description = "Python ground truth for whitebox-js: golden fixtures and dataset vendoring."
requires-python = ">=3.13"
dependencies = ["pydantic>=2", "pydantic-settings>=2", "numpy>=2"]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "scipy-stubs>=1.18.1.1",
]
oracle-core = [
    "scipy",
    "scikit-learn",
    "statsmodels",
    "sympy",
    "networkx",
    "scikit-image>=0.26.0",
    "shapely>=2.2.0",
    "pot>=0.9.7.post1",
    "cvxpy>=1.9.3",
    "pymoo>=0.6.2",
    "fairlearn>=0.15.0",
    "sacrebleu>=2.6.0",
    "rouge-score>=0.1.2",
    "jiwer>=4.0.0",
    "pystoi>=0.4.1",
    "pycocotools>=2.0.11",
    "properscoring>=0.1",
    "pingouin>=0.7.0",
    "krippendorff>=0.9.0",
    "prdc>=0.2",
    "sewar>=0.4.10",
    "dtw-python>=1.9.0",
    "control>=0.10.2",
    "slycot>=0.7.1",
    "npeet",
    "reedsolo>=1.7.0",
    "antropy>=0.2.3",
    "scikit-commpy>=0.8.0",
    "pyitlib>=0.3.1",
    "bitarray>=3.12.3",
    "filterpy>=1.4.5",
    "nolds>=0.6.3",
    "ruptures>=1.1.10",
    "pysindy>=2.1.0",
    "python-constraint2>=2.7.3",
    "pyperplan>=2.1",
    "pysubgroup>=0.8.0",
    "tokenizers>=0.23.3",
    "nltk>=3.10.4",
    "rapidfuzz>=3.14.6",
    "datasketch>=2.0.0",
    "jellyfish>=1.3.0",
    "pyphen>=0.18.1",
    "biopython>=1.88",
    "gensim>=4.4.0",
    "rank-bm25>=0.2.2",
]
oracle-torch = [
    "gpytorch>=1.15.2",
    "monai>=1.6.1",
    "optax>=0.2.8",
    "pytorch-crf>=0.7.2",
    "torch",
    "torchdiffeq>=0.2.5",
    "torchmetrics>=1.9.0",
    "torchvision>=0.29.1",
]
oracle-prob = [
    "causal-learn>=0.1.4.8",
    "hmmlearn>=0.3.3",
    "pgmpy",
    "pyagrum>=3.3.0",
    "sklearn-crfsuite>=0.5.0",
]
oracle-rl = ["gymnasium"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oracle/whitebox_oracle"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# ANN: every function and method annotates its arguments and its return type (including `-> None`).
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.pyright]
include = ["oracle"]
pythonVersion = "3.13"
# Resolve `whitebox_oracle` as local source, not as an installed library without a py.typed marker.
extraPaths = ["oracle"]
typeCheckingMode = "strict"
# Our own signatures are fully annotated (ruff ANN) and checked strictly. Several oracle libraries (scikit-learn,
# statsmodels, pgmpy, gymnasium) ship no type information, so types inferred through them are not checked.
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.uv.sources]
npeet = { git = "https://github.com/gregversteeg/NPEET" }
