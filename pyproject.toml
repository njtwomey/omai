[project]
name = "whitebox-oracle"
version = "0.1.0"
description = "Python ground truth for whitebox-js: golden fixtures and dataset vendoring."
requires-python = ">=3.13"
dependencies = ["pydantic>=2", "pydantic-settings>=2", "numpy>=2"]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "scipy-stubs>=1.18.1.1",
]
oracle-core = [
    "scipy",
    "scikit-learn",
    "statsmodels",
    "sympy",
    "networkx",
    "scikit-image>=0.26.0",
    "shapely>=2.2.0",
    "pot>=0.9.7.post1",
    "cvxpy>=1.9.3",
    "pymoo>=0.6.2",
    "npeet",
    "reedsolo>=1.7.0",
    "antropy>=0.2.3",
    "scikit-commpy>=0.8.0",
    "pyitlib>=0.3.1",
    "bitarray>=3.12.3",
]
oracle-torch = [
    "optax>=0.2.8",
    "pytorch-crf>=0.7.2",
    "torch",
]
oracle-prob = [
    "causal-learn>=0.1.4.8",
    "hmmlearn>=0.3.3",
    "pgmpy",
    "pyagrum>=3.3.0",
    "sklearn-crfsuite>=0.5.0",
]
oracle-rl = ["gymnasium"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oracle/whitebox_oracle"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# ANN: every function and method annotates its arguments and its return type (including `-> None`).
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.pyright]
include = ["oracle"]
pythonVersion = "3.13"
# Resolve `whitebox_oracle` as local source, not as an installed library without a py.typed marker.
extraPaths = ["oracle"]
typeCheckingMode = "strict"
# Our own signatures are fully annotated (ruff ANN) and checked strictly. Several oracle libraries (scikit-learn,
# statsmodels, pgmpy, gymnasium) ship no type information, so types inferred through them are not checked.
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.uv.sources]
npeet = { git = "https://github.com/gregversteeg/NPEET" }
