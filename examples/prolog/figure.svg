<svg xmlns="http://www.w3.org/2000/svg" width="1107.1" height="739.2" viewBox="0 0 1107.1 739.2"><title>The search tree of the query grandparent(tom, W): the answers, and the branches that fail and backtrack</title><rect width="100%" height="100%" fill="#ffffff"></rect><text x="20" y="22" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0a0a0a">A Prolog program and the search that answers one question</text><text x="20" y="40" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0a0a0a">The program</text><text x="20" y="59" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#0a0a0a">parent/2 #1   parent(tom, bob).</text><text x="20" y="78" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#0a0a0a">parent/2 #2   parent(tom, liz).</text><text x="20" y="97" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#0a0a0a">parent/2 #3   parent(tom, sam).</text><text x="20" y="116" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#0a0a0a">parent/2 #4   parent(bob, ann).</text><text x="20" y="135" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#0a0a0a">parent/2 #5   parent(bob, pat).</text><text x="20" y="154" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#0a0a0a">parent/2 #6   parent(liz, joe).</text><text x="20" y="173" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#0a0a0a">grandparent/2 #1   grandparent(X, Z) :- parent(X, Y), parent(Y, Z).</text><text x="20" y="208" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0a0a0a">The query</text><text x="20" y="227" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#0a0a0a">?- grandparent(tom, W).</text><text x="20" y="262" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0a0a0a">The answers</text><text x="20" y="281" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#0a0a0a">W = ann   W = pat   W = joe</text><text x="20" y="316" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0a0a0a">How to read the tree</text><text x="20" y="335" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#0a0a0a">Each arrow replaces the goal above it with</text><text x="20" y="354" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#0a0a0a">what is left to prove after one clause is used;</text><text x="20" y="373" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#0a0a0a">the arrow names the clause (predicate and number).</text><text x="20" y="392" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#0a0a0a">[ ] is an empty goal: it is proved, and the</text><text x="20" y="411" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#0a0a0a">value found for W is an answer.</text><text x="20" y="430" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#0a0a0a">fail: no clause matches, so the search goes</text><text x="20" y="449" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#0a0a0a">back (backtracks) to try the next one.</text><text x="753.55" y="19" text-anchor="middle" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0a0a0a">the proof search for the query</text><svg x="400" y="26" width="707.1" height="709.2" overflow="visible"><svg xmlns="http://www.w3.org/2000/svg" width="667.1" height="709.2" viewBox="0 0 667.1 709.2"><g data-node-id="edge:0"><path d="M342.4,56L342.4,146" stroke-linejoin="round" stroke-linecap="round" fill="none" stroke="#737373" stroke-width="1.2"/><polygon points="342.4,146 339.52,139.6 345.28,139.6" fill="#737373"/></g><g data-node-id="edge:1"><path d="M252.1337539432177,363.6L177.46498422712932,453.6" stroke-linejoin="round" stroke-linecap="round" fill="none" stroke="#737373" stroke-width="1.2"/><polygon points="177.464984,453.6 179.334973,446.835568 183.76794,450.513393" fill="#737373"/></g><g data-node-id="edge:2"><path d="M107.72572815533981,563.2L67.85922330097087,653.2" stroke-linejoin="round" stroke-linecap="round" fill="none" stroke="#737373" stroke-width="1.2"/><polygon points="67.859223,653.2 67.818035,646.181973 73.084484,648.514806" fill="#737373"/></g><g data-node-id="edge:3"><path d="M156.27427184466018,563.2L196.14077669902912,653.2" stroke-linejoin="round" stroke-linecap="round" fill="none" stroke="#737373" stroke-width="1.2"/><polygon points="196.140777,653.2 190.915516,648.514806 196.181965,646.181973" fill="#737373"/></g><g data-node-id="edge:4"><path d="M350.4227129337539,363.6L357.05914826498423,453.6" stroke-linejoin="round" stroke-linecap="round" fill="none" stroke="#737373" stroke-width="1.2"/><polygon points="357.059148,453.6 353.7163,447.42912 359.460704,447.005538" fill="#737373"/></g><g data-node-id="edge:5"><path d="M361.1,563.2L361.1,653.2" stroke-linejoin="round" stroke-linecap="round" fill="none" stroke="#737373" stroke-width="1.2"/><polygon points="361.1,653.2 358.22,646.8 363.98,646.8" fill="#737373"/></g><g data-node-id="edge:6"><path d="M424.6435331230284,363.6L492.67586750788644,453.6" stroke-linejoin="round" stroke-linecap="round" fill="none" stroke="#737373" stroke-width="1.2"/><polygon points="492.675868,453.6 486.519107,450.231216 491.114029,446.757847" fill="#737373"/></g><g data-node-id="edge:7"><path d="M534.1,563.2L534.1,653.2" stroke-linejoin="round" stroke-linecap="round" fill="none" stroke="#737373" stroke-width="1.2"/><polygon points="534.1,653.2 531.22,646.8 536.98,646.8" fill="#737373"/></g><g data-node-id="n0" transform="translate(0 0) rotate(0) scale(1)">